name: Build PDF

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf:
    name: XeLaTeX
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          texlive_version: 2026
          os: debian
          latexmk_use_xelatex: true
          latexmk_shell_escape: true
          args: >-
            -file-line-error
            -halt-on-error
            -interaction=nonstopmode
            -jobname=icpc-template
            -outdir=output/pdf
          pre_compile: mkdir -p output/pdf

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: icpc-template-pdf
          path: output/pdf/icpc-template.pdf
          if-no-files-found: error

